<!-- .storybook/manager-head.html -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Overpass&display=swap");
  @import url("https://fonts.googleapis.com/css2?family=Fira Code&display=swap");
  @import url("node_modules/@ilo-org/styles/css/global.css");
</style>

<!-- Canonical URL -->
<link href="https://twig.ui.ilo.org" rel="canonical" />

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

<!-- Fonts -->
<style>
  body {
    line-height: 1;
  }
  button {
    font: initial;
  }

  .sidebar-container,
  .docblock-argstable-body,
  .docblock-argstable-head {
    font-family: "Overpass", sans-serif !important; /* Customize the sidebar font */
  }

  /* Storybook 10 renders toolbar tools with the Button "ghost" variant, which
     ignores the bar* colors set in theme.js (it uses textMutedColor and
     colorSecondary instead). Restore white icons that turn ILO yellow on
     hover, press and when toggled on. Tabs (role="tab") still follow the
     theme, so leave them alone. */
  .sb-bar button:not([role="tab"]) {
    color: var(--ilo-color-neutrals-white);
  }

  .sb-bar button:not([role="tab"]):hover,
  .sb-bar button:not([role="tab"]):active,
  .sb-bar button:not([role="tab"])[aria-pressed="true"],
  .sb-bar button:not([role="tab"])[aria-checked="true"],
  .sb-bar button:not([role="tab"])[aria-expanded="true"] {
    color: var(--ilo-color-yellow-400);
    background: rgba(255, 205, 45, 0.15); /* --ilo-color-yellow-400 at 15% */
  }

  /* Storybook 9 tints the addon panel count badges with the secondary
     color, which is unreadable against the dark bar. */
  .sb-bar .tabbutton span + div {
    color: var(--ilo-color-brand-800);
    background: var(--ilo-color-brand-100);
  }
</style>
