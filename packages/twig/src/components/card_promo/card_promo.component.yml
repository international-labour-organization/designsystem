promocard:
  namespace: Components/Cards
  use: "@components/card_promo/card_promo.twig"
  label: Promo Card
  description: A promo card component for displaying links to content. It can have a title, link, intro, image and additional call to action.
  visibility: storybook
  fields:
    cta:
      type: object
      label: cta
      description: An optional button that can be used to link to a page.
      preview:
        label: "Read the press release"
        url: "https://www.ilo.org/global/about-the-ilo/newsroom/news/WCMS_846303/lang--en/index.htm"
    eyebrow:
      type: string
      label: Eyebrow
      description: Eyebrow copy
      preview: "Podcast"
    image:
      type: object
      label: Image
      description: Optional image settings for the card. This should include a `url`, which is an array of objects with an `src` property pointing to the image file and a `breakpoint` property which is either a number indicating the minimum viewport width at which the image should be displayed or a media query. It can also contain an `alt` property for the image's alt text and a `loading` property for the image's loading attribute. The image is shown above the content, or beside it in `wide` and `fluid` cards on larger screens.
    intro:
      type: string
      label: Intro
      description: Intro copy text
      preview: "A toxic combination of mutually-reinforcing crises – inflation, debt, food and fuel price rises, geopolitical tensions and conflict, climate change – are threatening to increase poverty, inequality and discrimination worldwide."
    link:
      type: string
      label: Link
      description: Link field for the card
      preview: "https://www.ilo.org/"
    title:
      type: string
      label: Title
      description: Title field for the card
      preview: Can digital technology be an equality machine?
  settings:
    cornercut:
      type: boolean
      label: cornercut
      description: Sets the cornercut of the card. If not set, the card will appear as `square`.
      required: false
      preview: true
    size:
      type: select
      label: Size
      description: Sets the size of the card. If not set, the card will appear as `standard`.
      required: false
      preview: "standard"
      options:
        standard: standard
        narrow: narrow
        wide: wide
        fluid: fluid
    theme:
      type: select
      label: Theme
      description: Sets the card to appear as either light or dark. If not set, the card will inherit the theme of its parent.
      required: false
      preview: "light"
      options:
        dark: Dark
        light: Light
    titleLevel:
      type: select
      label: Title Element
      description: HTML element used for the title
      required: false
      options:
        p: p
        h1: h1
        h2: h2
        h3: h3
        h4: h4
        h5: h5
      preview: "p"
  variants:
    default:
      label: Default
    with_image:
      label: With image
      description: A narrow card with the image above the content.
      settings:
        size: "narrow"
        cornercut: false
      fields:
        image:
          alt: "Image alt text"
          loading: "lazy"
          url:
            - breakpoint: "(min-width: 0px)"
              src: "/images/small.jpg"
            - breakpoint: "(min-width: 800px)"
              src: "/images/medium.jpg"
            - breakpoint: "(min-width: 1200px)"
              src: "/images/large.jpg"
            - breakpoint: "(min-width: 1440px)"
              src: "/images/large.jpg"
    with_image_wide:
      label: With image wide
      description: In `wide` and `fluid` cards the image sits beside the content on larger screens.
      settings:
        size: "wide"
        cornercut: false
      fields:
        image:
          alt: "Image alt text"
          loading: "lazy"
          url:
            - breakpoint: "(min-width: 0px)"
              src: "/images/small.jpg"
            - breakpoint: "(min-width: 800px)"
              src: "/images/medium.jpg"
            - breakpoint: "(min-width: 1200px)"
              src: "/images/large.jpg"
            - breakpoint: "(min-width: 1440px)"
              src: "/images/large.jpg"
