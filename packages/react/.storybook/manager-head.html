<!-- .storybook/manager-head.html -->
<style>
  @import url("/fonts/fonts-google.css");
  @import url("https://fonts.googleapis.com/css2?family=Overpass&display=swap");
  @import url("https://fonts.googleapis.com/css2?family=Fira Code&display=swap");
</style>

<!-- Canonical URL -->

<link href="https://react.ui.ilo.org" rel="canonical" />

<!-- Favicon -->
<link rel="icon" href="/favicon.ico" type="image/x-icon" />

<style>
  .sidebar-container,
  .docblock-argstable-body,
  .docblock-argstable-head {
    font-family:
      "Overpass", sans-serif !important; /* Customize the sidebar font */
  }

  /* Storybook 10 renders toolbar tools with the Button "ghost" variant, which
     ignores the bar* colors set in theme.ts (it uses textMutedColor and
     colorSecondary instead). Restore white icons that turn ILO yellow on
     hover, press and when toggled on. Tabs (role="tab") still follow the
     theme, so leave them alone. */
  .sb-bar button:not([role="tab"]) {
    color: rgba(255, 255, 255, 1); /* --ilo-color-neutrals-white */
  }

  .sb-bar button:not([role="tab"]):hover,
  .sb-bar button:not([role="tab"]):active,
  .sb-bar button:not([role="tab"])[aria-pressed="true"],
  .sb-bar button:not([role="tab"])[aria-checked="true"],
  .sb-bar button:not([role="tab"])[aria-expanded="true"] {
    color: rgba(255, 205, 45, 1); /* --ilo-color-yellow-400 */
    background: rgba(255, 205, 45, 0.15);
  }
</style>
